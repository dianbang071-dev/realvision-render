
name: Build REALVISION RENDER Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Configure engine
        run: cmake -S rv113work -B build -A x64 -DRV_ENABLE_VULKAN=OFF

      - name: Compile Windows EXE
        run: cmake --build build --config Release --parallel 2

      - name: Test executable
        shell: pwsh
        run: |
          $exe = "build/Release/realvision_render.exe"
          if (!(Test-Path $exe)) { throw "EXE tidak ditemukan" }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "Engine gagal dijalankan" }
          & $exe --scene rv113work/sample.rvscene --out build/test.bmp --width 320 --height 240 --samples 1
          if ($LASTEXITCODE -ne 0) { throw "Tes render gagal" }
          if (!(Test-Path "build/test.bmp")) { throw "Hasil BMP tidak ditemukan" }

      - name: Package portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/realvision_render.exe dist/
          Copy-Item rv113work/sample.rvscene dist/
          Copy-Item rv113work/README_ID.md dist/
          Compress-Archive -Path dist/* -DestinationPath REALVISION_RENDER_WINDOWS.zip -Force

      - name: Upload Windows engine
        uses: actions/upload-artifact@v4
        with:
          name: REALVISION_RENDER_WINDOWS
          path: REALVISION_RENDER_WINDOWS.zip
          retention-days: 30
